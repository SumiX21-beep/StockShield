services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - stockshield-postgres:/var/lib/postgresql/data
      - ./postgres/init-oms.sql:/docker-entrypoint-initdb.d/20-oms.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockshield"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
    image: stockshield:local
    command: ["npm", "run", "prisma:deploy"]
    environment: &stockshield-env
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stockshield?schema=public
      REDIS_URL: redis://redis:6379
      STOCKSHIELD_ENCRYPTION_KEY: compose-local-encryption-key-change-before-prod
      STOCKSHIELD_INTERNAL_API_TOKEN: compose-local-admin-token
      STOCKSHIELD_JWT_SECRET: compose-local-dashboard-jwt-secret
      STOCKSHIELD_JWT_EXPIRES_SECONDS: "43200"
      STOCKSHIELD_DASHBOARD_ORIGIN: http://localhost:5173
      STOCKSHIELD_AUTH_DISABLED: "false"
      STOCKSHIELD_ALLOWED_TENANT_IDS: ""
      STOCKSHIELD_TENANT_SCOPE_REQUIRED: "false"
      STOCKSHIELD_TENANT_SCOPE_DISABLED: "false"
      SLACK_WEBHOOK_URL: ""
      DRIFT_RISK_HIGH_THRESHOLD: "3"
      SHOPIFY_API_VERSION: "2025-10"
      SHOPIFY_WEBHOOK_SECRET: compose-local-webhook-secret
      STOCKSHIELD_OMS_SOURCE: internal
      OMS_DATABASE_URL: postgresql://readonly:readonly@postgres:5432/stockshield?schema=public
      OMS_INVENTORY_TABLE: oms.inventory_snapshot
      OMS_TENANT_COLUMN: tenant_id
      OMS_ROW_ID_COLUMN: id
      OMS_SKU_COLUMN: sku
      OMS_LOCATION_COLUMN: location_id
      OMS_STOCKED_COLUMN: stocked_quantity
      OMS_RESERVED_COLUMN: reserved_quantity
      OMS_UPDATED_AT_COLUMN: updated_at
      DRIFT_SCAN_INTERVAL_MINUTES: "5"
      DRIFT_SCAN_LIMIT: "1000"
      DRIFT_THRESHOLD: "0"
      DRIFT_SCAN_CONCURRENCY: "2"
      DRIFT_FIX_CONCURRENCY: "8"
      DRIFT_RECHECK_CONCURRENCY: "5"
      INVENTORY_SYNC_CONCURRENCY: "5"
      DRIFT_FIX_LOCK_TTL_MS: "60000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    image: stockshield:local
    command: ["npm", "run", "start:prod:api"]
    environment:
      <<: *stockshield-env
      PORT: "3000"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: stockshield:local
    command: ["npm", "run", "start:prod:worker"]
    environment:
      <<: *stockshield-env
      WORKER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  scheduler:
    image: stockshield:local
    command: ["npm", "run", "start:prod:scheduler"]
    environment:
      <<: *stockshield-env
      SCHEDULER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

volumes:
  stockshield-postgres:
